services:
  kombu:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://kombu:kombu@db:5432/kombu
      APP_SECRET: ${APP_SECRET:-kombu_production_secret_min_32_chars_override_me}
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
  db:
    image: postgres:15-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: kombu
      POSTGRES_USER: kombu
      POSTGRES_PASSWORD: kombu
    volumes: ["kombu-db-data:/var/lib/postgresql/data"]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  kombu-db-data:
