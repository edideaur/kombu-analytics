[program:kombu]
command=/usr/local/bin/kombu serve --listen 0.0.0.0:3000
user=kombu
autostart=true
autorestart=true
startretries=10
environment=DATABASE_URL="postgres://kombu:kombu@localhost:5432/kombu",APP_SECRET="replace_with_strong_secret_key",STORAGE_ENGINE="postgres"
stdout_logfile=/var/log/kombu.log
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=10
