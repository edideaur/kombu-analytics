name: '✨ Feature Request'
description: Propose a feature, parity enhancement, or architectural optimization for Kombu.
body:
  - type: textarea
    attributes:
      label: Describe the feature or enhancement
      description: A clear and concise description of what the feature, API endpoint, or UI enhancement is.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Motivation & Use Cases
      description: Why would this be useful? Who benefits from it?
  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Any alternative designs, workarounds, or prior art (e.g., Umami, Plausible, PostHog).
