name: CI

permissions:
  contents: write

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: "postgres://kombu:kombu@localhost:5432/kombu"

jobs:
  check-and-lint:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Toolchain with Retries
        run: |
          for i in 1 2 3 4 5; do
            rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --no-self-update && break || sleep 3
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy Warnings Deny
        run: cargo clippy --workspace --tests -- -D warnings

  test:
    name: Workspace Tests & Database Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kombu
          POSTGRES_PASSWORD: kombu
          POSTGRES_DB: kombu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Toolchain with Retries
        run: |
          for i in 1 2 3 4 5; do
            rustup toolchain install 1.97.1 --profile minimal --no-self-update && break || sleep 3
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Apply Migrations
        run: cargo run -p kombu-cli --bin kombu -- migrate
      - name: Run Cargo Test
        run: cargo test --workspace

  formal-verification:
    name: Kani Mathematical Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Toolchain with Retries
        run: |
          for i in 1 2 3 4 5; do
            rustup toolchain install 1.97.1 --profile minimal --no-self-update && break || sleep 3
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install Kani
        run: cargo install --locked kani-verifier && cargo kani setup
      - name: Verify kombu-core
        run: cargo kani -p kombu-core --output-format terse
      - name: Verify kombu-ingest
        run: cargo kani -p kombu-ingest --output-format terse
      - name: Verify kombu-query
        run: cargo kani -p kombu-query --output-format terse
      - name: Verify kombu-api
        run: cargo kani -p kombu-api --output-format terse

  build-frontend:
    name: Build Frontend SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Frontend SPA
        working-directory: webui
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
      - name: Upload Frontend Dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: webui/dist

  build-linux-binaries:
    name: Build Cross Binary (${{ matrix.target }})
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: i686-unknown-linux-gnu
          - target: i686-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
          - target: armv7-unknown-linux-gnueabihf
          - target: armv7-unknown-linux-musleabihf
          - target: arm-unknown-linux-gnueabihf
          - target: arm-unknown-linux-musleabihf
          - target: riscv64gc-unknown-linux-gnu
          - target: arm-unknown-linux-musleabi
          - target: powerpc64le-unknown-linux-gnu
          - target: s390x-unknown-linux-gnu
          - target: x86_64-unknown-freebsd
          - target: i686-unknown-freebsd
          - target: x86_64-pc-windows-gnu
          - target: i686-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: webui/dist
      - name: Install Toolchain with Retries
        run: |
          for i in 1 2 3 4 5; do
            rustup toolchain install 1.97.1 --profile minimal --no-self-update && break || sleep 3
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Install Cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin
      - name: Build Binary
        run: cross build --release --target ${{ matrix.target }} --bin kombu
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kombu-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/kombu
            target/${{ matrix.target }}/release/kombu.exe
          if-no-files-found: error

  build-macos-binaries:
    name: Build macOS Binaries (Intel, Apple Silicon, Lipo)
    needs: build-frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: webui/dist
      - name: Install Toolchain with Retries
        run: |
          for i in 1 2 3 4 5; do
            rustup toolchain install 1.97.1 --profile minimal --target x86_64-apple-darwin --target aarch64-apple-darwin --no-self-update && break || sleep 3
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - name: Build Intel Binary
        run: cargo build --release --target x86_64-apple-darwin --bin kombu
      - name: Build Apple Silicon Binary
        run: cargo build --release --target aarch64-apple-darwin --bin kombu
      - name: Create Universal Binary with Lipo
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/kombu target/x86_64-apple-darwin/release/kombu target/aarch64-apple-darwin/release/kombu
          lipo -info target/universal-apple-darwin/release/kombu
      - name: Upload Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kombu-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release/kombu
          if-no-files-found: error
      - name: Upload Apple Silicon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kombu-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/kombu
          if-no-files-found: error
      - name: Upload Universal Lipo Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kombu-universal-apple-darwin
          path: target/universal-apple-darwin/release/kombu
          if-no-files-found: error

  build-windows-binaries:
    name: Build Windows Binary (${{ matrix.target }})
    needs: build-frontend
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
          - target: aarch64-pc-windows-msvc
            arch: x64_arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: webui/dist
      - name: Remove GNU Linker
        run: |
          if (Test-Path "C:\Program Files\Git\usr\bin\link.exe") {
            Remove-Item "C:\Program Files\Git\usr\bin\link.exe" -Force
          }
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Install Toolchain with Retries
        run: |
          for i in 1 2 3 4 5; do
            rustup toolchain install 1.97.1 --profile minimal --target ${{ matrix.target }} --no-self-update && break || sleep 3
          done
        shell: bash
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }} --bin kombu
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kombu-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kombu.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.ref == 'refs/heads/main'
    needs:
      - check-and-lint
      - test
      - formal-verification
      - build-linux-binaries
      - build-macos-binaries
      - build-windows-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "kombu" -o -name "kombu.exe" \) | while read -r file; do
            dir=$(basename "$(dirname "$file")")
            target=${dir#kombu-}
            if [[ "$file" == *.exe ]]; then
              cp "$file" "release_assets/kombu-${target}.exe"
            else
              cp "$file" "release_assets/kombu-${target}"
              chmod +x "release_assets/kombu-${target}"
            fi
          done
          cd release_assets
          sha256sum * > SHA256SUMS
          ls -la
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.0-rev.${GITHUB_SHA:0:8}"
          gh release create "$TAG" release_assets/* \
            --target "$GITHUB_SHA" \
            --title "Kombu Analytics $TAG" \
            --notes "Automated release build for commit $GITHUB_SHA"
