name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: "postgres://kombu:kombu@localhost:5432/kombu"

jobs:
  check-and-lint:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Toolchain with Retries
        run: |
          for i in 1 2 3 4 5; do
            rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --no-self-update && break || sleep 3
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Clippy Warnings Deny
        run: cargo clippy --workspace --tests -- -D warnings

  test:
    name: Workspace Tests & Database Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kombu
          POSTGRES_PASSWORD: kombu
          POSTGRES_DB: kombu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Toolchain with Retries
        run: |
          for i in 1 2 3 4 5; do
            rustup toolchain install 1.97.1 --profile minimal --no-self-update && break || sleep 3
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Apply Migrations
        run: cargo run -p kombu-cli --bin kombu -- migrate
      - name: Run Cargo Test
        run: cargo test --workspace

  formal-verification:
    name: Kani Mathematical Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Toolchain with Retries
        run: |
          for i in 1 2 3 4 5; do
            rustup toolchain install 1.97.1 --profile minimal --no-self-update && break || sleep 3
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install Kani
        run: cargo install --locked kani-verifier && cargo kani setup
      - name: Verify kombu-core
        run: cargo kani -p kombu-core --output-format terse
      - name: Verify kombu-ingest
        run: cargo kani -p kombu-ingest --output-format terse
      - name: Verify kombu-query
        run: cargo kani -p kombu-query --output-format terse
      - name: Verify kombu-api
        run: cargo kani -p kombu-api --output-format terse

  build-frontend:
    name: Build Frontend SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Frontend SPA
        working-directory: webui
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          ln -sfn ../webui/node_modules ../umami/node_modules || true
          npm run build
      - name: Upload Frontend Dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: webui/dist

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: i686-unknown-linux-gnu
          - target: i686-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
          - target: armv7-unknown-linux-gnueabihf
          - target: armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: webui/dist
      - name: Install Toolchain with Retries
        run: |
          for i in 1 2 3 4 5; do
            rustup toolchain install 1.97.1 --profile minimal --no-self-update && break || sleep 3
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Install Cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin
      - name: Build Binary
        run: cross build --release --target ${{ matrix.target }} --bin kombu
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kombu-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kombu
          if-no-files-found: error
