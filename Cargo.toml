[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Kombu"]
repository = "https://github.com/kombu-analytics/kombu"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.8", features = ["json", "query"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "v5", "v7", "serde"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
jsonwebtoken = "9.3"
argon2 = "0.5"
bcrypt = "0.17"
blake3 = "1.5"
validator = { version = "0.18", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
arc-swap = "1.9"
quick_cache = { version = "0.7" }
ipnet = "2.12"
maxminddb = "0.24"
isbot = "0.1"
sha2 = "0.10"
tikv-jemallocator = "0.6"
base64 = "0.22"
totp-rs = { version = "6.0", features = ["gen_secret", "otpauth", "qr"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sentry = { version = "0.42.0", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
collapsible_if = "allow"
uninlined_format_args = "allow"
needless_raw_string_hashes = "allow"
redundant_closure = "allow"
redundant_closure_for_method_calls = "allow"
match_same_arms = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
format_push_string = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
